name = "nanuri-form"
main = "src/index.js"
compatibility_date = "2026-08-13"

# 예약 실행 — R2 에 남은 고아 영수증(미리 올렸지만 접수까지 안 온 것)을 쓸어낸다.
# 매일 18:00 UTC = 03:00 KST(트래픽 적은 시간). 참조된 영수증은 절대 안 지운다
# (`src/index.js` 의 cleanupOrphanReceipts).
[triggers]
crons = ["0 18 * * *"]

# 영수증 이미지 버킷.
#
# 예전에는 `nanuri-bill` 이라는 별도 워커가 이 버킷을 들고 있었고 여기서는 서비스
# 바인딩으로 넘겼다. 그 워커는 대시보드에서 만든 것이라 **소스가 어디에도 없어서**
# 고칠 수도 되돌릴 수도 없었다. 버킷을 직접 붙이고 코드를 가져왔다 (`src/receipts.js`).
#
# ⚠️ 이 버킷은 `nanuri-bill` 이 쓰던 것과 **같은 것**이어야 한다. 다른 버킷을 적으면
#    이미 올라간 영수증을 못 지운다 (새로 올리는 건 되는데 옛 URL 의 키가 여기 없다).
#    계정에 R2 버킷이 둘 있는데 `church-files` 는 공개 접근이 꺼져 있어 영수증을
#    서빙할 수 없다. 영수증은 `nanuri-bills` 다. (SETUP.md 9번)
[[r2_buckets]]
binding = "RECEIPT_BUCKET"
bucket_name = "nanuri-bills"

[vars]
SUPABASE_URL = "https://ciszaukmnglepvqpulya.supabase.co"

# 영수증 버킷의 공개 도메인. 저장된 영수증 URL 이 전부 이걸로 시작하고,
# 삭제할 때 이 앞부분을 떼어 키를 얻는다. **바꾸면 옛 영수증을 못 지운다.**
# 비밀이 아니다 — 이 주소는 앱이 이미지 URL 로 들고 다닌다.
R2_PUBLIC_URL = "https://pub-1ff72bbd269d4c6ebe9c8f4dcbce52dc.r2.dev"

# APNs 토픽 = 앱 번들 ID
APNS_TOPIC = "com.ciracino88.NanuriAdmin"

# Apple Developer 팀 ID.
# 비밀이 아니다. 배포되는 앱 바이너리의 embedded.mobileprovision 안에 들어가고
# Xcode Signing & Capabilities 탭에도 그대로 표시된다.
APNS_TEAM_ID = "23ULXV7A5W"

# APNs 인증 키 ID (10자리). 키를 가리키는 번호일 뿐 단독으로는 아무것도 못 한다.
# developer.apple.com > Certificates, Identifiers & Profiles > Keys 에서
# APNs 키를 만들면 나온다. (키 이름 "NanuriAdmin APNs", 2026-08-15 발급)
APNS_KEY_ID = "L7P845D626"

# IP당 요청 횟수 제한을 세는 KV.
#
# 예전에는 네이티브 `[[ratelimits]]` 바인딩을 썼는데 이 계정에서는 카운팅이 안 됐다
# (limit=1/10s 로 낮춰도 전부 통과 — 플랜/계정 수준 문제로 추정). 그래서 KV 로 직접
# 창(window)별 카운터를 센다 (`src/index.js` 의 withinRateLimit).
#   /bill/receipt : IP당 분당 20 · 시간당 120   (R2 에 이미지를 쓰는 곳)
#   /bill/submit  : IP당 분당 10
# 상한을 넉넉히 둔 이유는 CGNAT·공용 와이파이로 여러 사람이 한 IP 로 보일 수 있어서다.
#
# ⚠️ id 는 `npx wrangler kv namespace create RATE_KV` 로 만들어 채운다.
#    KV 무료 티어는 하루 쓰기 상한(1,000)이 있다 — 이 폼의 정상 트래픽에는 넘치지만,
#    몇 시간짜리 지속 공격이 오면 카운터 쓰기가 막혀 fail-open 이 된다. 그런 일이
#    실제로 생기면 Workers 유료($5)로 올려 네이티브 rate limit 을 쓰거나 Durable
#    Object 로 옮기는 게 다음 수순이다. (평소 위협 모델에는 KV 로 충분하다)
[[kv_namespaces]]
binding = "RATE_KV"
id = "a177060737ab49289c7cad549f9cf9b3"

# 진짜 비밀만 시크릿으로 둔다. wrangler secret put 으로 등록한다.
# (위 [vars] 에 있는 값들은 유출돼도 그 자체로는 아무것도 못 하는 식별자다)
#
#   SUPABASE_SERVICE_ROLE_KEY  RLS를 통째로 우회한다. 절대 앱에 넣지 말 것.
#   APNS_P8                    푸시를 서명하는 개인키. .p8 파일 내용 전체
#                              (-----BEGIN PRIVATE KEY----- 줄까지 포함)
