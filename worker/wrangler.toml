name = "nanuri-form"
main = "src/index.js"
compatibility_date = "2026-08-13"

# 영수증 업로드를 위임할 기존 R2 워커.
#
# 공개 URL로 fetch 하면 안 된다. 두 워커가 같은 workers.dev 서브도메인에 있어서
# 요청이 자기 자신으로 되돌아오고, 이 워커에는 /upload 라우트가 없으므로 404가 난다.
# 서비스 바인딩은 공용 인터넷도 DNS도 타지 않고 워커끼리 직접 연결하므로,
# 계정 서브도메인을 바꿔도 영향받지 않는다.
[[services]]
binding = "RECEIPT_WORKER"
service = "nanuri-bill"

[vars]
SUPABASE_URL = "https://ciszaukmnglepvqpulya.supabase.co"

# APNs 토픽 = 앱 번들 ID
APNS_TOPIC = "com.ciracino88.NanuriAdmin"

# 공개 폼이라 제출을 IP당 분당 5건으로 제한하려고 걸어둔 바인딩.
#
# ⚠️ 2026-08-15 현재 이 계정에서는 실제로 카운팅이 되지 않는다.
#    바인딩은 런타임에 존재하고 .limit() 도 {success:true} 를 정상 반환하는데,
#    limit=1/10s 로 낮추고 namespace_id 를 새로 발급해도 전부 통과한다.
#    (설정은 문서와 일치. 원인 미상 — 플랜/계정 수준 문제로 추정)
#    즉 지금 공개 폼에는 실질적인 남용 방지가 없다. 제한이 필요해지면
#    Turnstile 을 붙이거나 접수 경로를 좁히는 쪽을 먼저 검토할 것.
#    코드는 success 를 그대로 따르므로, 나중에 동작하기 시작하면 그때부터 걸린다.
[[ratelimits]]
name = "SUBMIT_RATE_LIMIT"
namespace_id = "2001"
simple = { limit = 5, period = 60 }

# 시크릿은 여기 두지 않는다. wrangler secret put 으로 등록한다.
#   SUPABASE_SERVICE_ROLE_KEY  RLS를 우회하는 키. 절대 앱에 넣지 말 것.
#   APNS_KEY_ID                APNs 인증 키 ID
#   APNS_TEAM_ID               Apple Developer 팀 ID
#   APNS_P8                    .p8 파일 내용 전체 (BEGIN/END 줄 포함)
